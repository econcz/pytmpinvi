# This workflow builds the package and runs the tests against the installed
# wheel on every push and pull request

# NOTE: the dependencies pytmpinv>=5.0.0 and pyclsp>=5.0.0 are installed from
# PyPI, so these jobs require pytmpinv 5.0.0 and pyclsp 5.0.0 to be published
# on PyPI.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the distributions
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl

      - name: Run the tests against the installed wheel
        env:
          TMPINVI_TEST_INSTALLED: "1"
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/test_tmpinvi.py
